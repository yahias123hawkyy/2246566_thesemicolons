<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seismic Command Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <h1>⬡ Seismic Command Dashboard</h1>
  <div id="topbar-right">
    <span id="clock">--:--:-- UTC</span>
    <span class="pill grey" id="conn-pill">
      <span class="dot grey" id="conn-dot"></span>
      <span id="conn-text">Connecting…</span>
    </span>
  </div>
</div>

<div id="layout">

  <!-- Stats row -->
  <div id="stats">
    <div class="stat">
      <div class="stat-label">Total Events</div>
      <div class="stat-value all" id="st-total">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Earthquakes</div>
      <div class="stat-value eq" id="st-eq">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Explosions</div>
      <div class="stat-value ex" id="st-ex">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Nuclear</div>
      <div class="stat-value nu" id="st-nu">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Replicas Online</div>
      <div class="stat-value all" id="st-rep">—</div>
    </div>
  </div>

  <!-- Main: left -->
  <div id="main">

    <!-- Alert feed -->
    <div class="panel-hdr">
      <span class="panel-title">Live Alerts</span>
      <span id="alert-count" style="font-size:11px;color:#666">0 events</span>
    </div>
    <div class="filter-bar">
      <button class="fbtn active" data-type="ALL">All</button>
      <button class="fbtn" data-type="EARTHQUAKE">Earthquake</button>
      <button class="fbtn" data-type="EXPLOSION">Explosion</button>
      <button class="fbtn" data-type="NUCLEAR">Nuclear</button>
    </div>
    <div id="alert-feed">
      <div class="empty" id="alert-empty">No events detected yet.</div>
    </div>

    <!-- History -->
    <div id="history-wrap">
      <div class="panel-hdr">
        <span class="panel-title">Event History</span>
        <span id="history-count" style="font-size:11px;color:#666">—</span>
      </div>
      <div class="tbl-scroll">
        <table>
          <thead>
            <tr>
              <th>Timestamp (UTC)</th>
              <th>Sensor</th>
              <th>Type</th>
              <th>Freq (Hz)</th>
              <th>Replica</th>
            </tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </div>

  </div><!-- /main -->

  <!-- Sidebar: right -->
  <div id="sidebar">

    <!-- Replica status -->
    <div id="replica-panel">
      <div class="panel-hdr">
        <span class="panel-title">Processor Nodes</span>
      </div>
      <div id="replica-list">
        <div class="empty" style="padding:10px 12px;color:#444">Loading…</div>
      </div>
    </div>

    <!-- Admin controls -->
    <div id="admin-panel">
      <div class="panel-hdr">
        <span class="panel-title">Admin Controls</span>
      </div>

      <!-- Manual shutdown -->
      <div class="admin-row">
        <label class="admin-label">Trigger Shutdown</label>
        <button class="btn danger" id="btn-shutdown">▶ Send SHUTDOWN Command</button>
        <div id="admin-log"></div>
      </div>

      <!-- Inject sensor event -->
      <div class="admin-row">
        <label class="admin-label">Inject Sensor Event</label>
        <select id="inj-sensor"></select>
        <select id="inj-type">
          <option value="earthquake">earthquake</option>
          <option value="conventional_explosion">conventional_explosion</option>
          <option value="nuclear_like">nuclear_like</option>
          <option value="calibration_pulse">calibration_pulse</option>
          <option value="datacenter_shutdown_disturbance">datacenter_shutdown_disturbance</option>
        </select>
        <button class="btn" id="btn-inject">▶ Inject Event</button>
        <div id="inject-log"></div>
      </div>
    </div>

    <!-- System log -->
    <div id="syslog-panel">
      <div class="panel-hdr">
        <span class="panel-title">System Log</span>
      </div>
      <div id="syslog"></div>
    </div>

  </div><!-- /sidebar -->

</div><!-- /layout -->

<script src="app.js"></script>
</body>
</html>
